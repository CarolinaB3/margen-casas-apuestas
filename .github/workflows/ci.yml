name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-y-tests:
    name: lint-y-tests
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Cosmos lista los modelos con dbt al cargar el DAG: dbt va en su propio venv.
      DBT_EXECUTABLE_PATH: ${{ github.workspace }}/.dbt_venv/bin/dbt
      # Valores de mentira: dbt los exige para leer profiles.yml, pero no se conecta.
      SNOWFLAKE_ACCOUNT: ci
      SNOWFLAKE_USER: ci
      SNOWFLAKE_ROLE: ci
      SNOWFLAKE_WAREHOUSE: ci
      SNOWFLAKE_DATABASE: APUESTAS
      SNOWFLAKE_PRIVATE_KEY_PATH: /dev/null
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias (con las constraints de Airflow 2.10.5)
        run: >
          pip install "apache-airflow==2.10.5" -r requirements.txt -r requirements-dev.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"

      - name: Instalar dbt en un virtualenv aparte (igual que en la imagen)
        run: |
          python -m venv .dbt_venv
          .dbt_venv/bin/pip install "dbt-core==1.12.5" "dbt-snowflake==1.12.1"

      - name: Validar el proyecto dbt (sin conexión)
        working-directory: dbt/apuestas
        run: ../../.dbt_venv/bin/dbt parse --profiles-dir .

      - name: Lint (ruff)
        run: ruff check .

      - name: Inicializar la base de Airflow
        run: airflow db migrate

      - name: Tests (pytest)
        run: pytest -v
