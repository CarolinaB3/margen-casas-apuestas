name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  lint-y-tests:
    name: lint-y-tests
    runs-on: ubuntu-latest
    env:
      AIRFLOW_HOME: ${{ github.workspace }}/.airflow
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias (con las constraints de Airflow 2.10.5)
        run: >
          pip install "apache-airflow==2.10.5" -r requirements.txt -r requirements-dev.txt
          --constraint "https://raw.githubusercontent.com/apache/airflow/constraints-2.10.5/constraints-3.12.txt"

      - name: Lint (ruff)
        run: ruff check .

      - name: Inicializar la base de Airflow
        run: airflow db migrate

      - name: Tests (pytest)
        run: pytest -v
